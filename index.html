<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14463e">
<title>Qazo hisobi</title>
<style>
:root{--bg:#eef2ee;--card:#fff;--ink:#12332e;--mut:#6a7f7a;--ac:#1f6f5c;--ac2:#e3efe9;--gold:#b8892b;--line:#d5e0db;--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1c19;--card:#142a26;--ink:#e6f0ec;--mut:#8aa39c;--ac:#4cb69c;--ac2:#1c3a34;--gold:#e0b04d;--line:#244039}}
:root[data-theme=dark]{--bg:#0c1c19;--card:#142a26;--ink:#e6f0ec;--mut:#8aa39c;--ac:#4cb69c;--ac2:#1c3a34;--gold:#e0b04d;--line:#244039}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font:600 26px Georgia,serif;margin:6px 0 2px}
h2{font:600 18px Georgia,serif;margin:0 0 10px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.hero{background:var(--ac);color:#fff;border:0;text-align:center;padding:22px 16px}
:root[data-theme=dark] .hero,:root:not([data-theme=light]) .hero{--h:1}
.hero .big{font:600 56px/1 Georgia,serif;margin:4px 0}
.hero .l{opacity:.85;font-size:14px}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:8px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#f1d48a;border-radius:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{flex:1}
.row .n b{display:block;font-weight:600}
.row .n span{font-size:13px;color:var(--mut)}
.st{display:flex;align-items:center;gap:6px}
.st button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--ac2);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.st button:active{transform:scale(.94)}
.st output{min-width:26px;text-align:center;font:600 18px Georgia,serif}
.mini{height:5px;background:var(--ac2);border-radius:5px;margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ac)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 16px system-ui;margin-top:16px;cursor:pointer}
.btn.g{background:var(--ac2);color:var(--ink);margin-top:10px}
.btn.r{background:transparent;color:#c0392b;border:1px solid #c0392b}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dh{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.d{aspect-ratio:1/1.05;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--ink);padding:0}
.d small{font:600 12px Georgia,serif;color:var(--ac);min-height:15px}
.d.has{background:var(--ac2)}
.d.full{background:var(--ac);color:#fff}.d.full small{color:#f1d48a}
.d.today{outline:2px solid var(--gold)}
.d.sel{box-shadow:0 0 0 2px var(--ink)}
.d.x{visibility:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font:600 24px Georgia,serif;color:var(--ac)}
.stats span{font-size:12px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 0 10px;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac);font-weight:600}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.res{background:var(--ac2);border-radius:14px;padding:14px;margin-top:14px;text-align:center}
.res b{font:600 30px Georgia,serif;color:var(--ac)}
.cols .b{}
@media(min-width:900px){
body{padding:0 0 0 230px}
.wrap{max-width:1040px;padding:30px 36px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
.cols>.a,.cols>.c{grid-column:1}
.cols>.b{grid-column:2;grid-row:1/3}
.hero .big{font-size:68px}
nav{top:0;bottom:auto;right:auto;width:230px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:28px 14px;gap:4px;justify-content:flex-start}
nav button{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;border-radius:12px;font-size:15px}
nav button b{display:inline;font-size:18px;width:22px}
nav button.on{background:var(--ac2)}
nav:before{content:"Qazo hisobi";font:600 20px Georgia,serif;padding:4px 16px 22px;color:var(--ink)}
}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<script>
const P=['Bomdod','Peshin','Asr','Shom','Xufton','Vitr'];
const MON=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
const KEY='qazo_v1';
let S=null,tab='home',cm=new Date(),sel=null,draft={g:'m',age:15};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let today=fmt(new Date());sel=today;
function tick(){const t=fmt(new Date());if(t===today)return;if(sel===today)sel=t;today=t;cm=new Date();if(S&&tab!=='set')render()}
setInterval(tick,20000);document.addEventListener('visibilitychange',tick);window.addEventListener('focus',tick);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function calc(g,birth,start,age,haid){
  const b=new Date(birth),s=new Date(start);
  const bal=new Date(b.getFullYear()+age,b.getMonth(),b.getDate());
  let days=Math.floor((s-bal)/864e5);
  if(g==='f'&&haid>0)days-=Math.round(days/30.44*haid);
  return Math.max(0,days);
}
const done=p=>Object.values(S.log).reduce((a,d)=>a+(d[p]||0),0);
const left=p=>Math.max(0,S.total[p]-done(p));
const dayN=k=>Object.values(S.log[k]||{}).reduce((a,v)=>a+v,0);
function add(k,p,d){
  const cur=(S.log[k]||{})[p]||0;
  if(d>0&&left(p)<=0)return;
  const v=Math.max(0,cur+d);
  if(v===cur)return;
  S.log[k]=S.log[k]||{};S.log[k][p]=v;
  if(!dayN(k))delete S.log[k];
  save();render();
}
function steppers(k){
  return P.map((p,i)=>`<div class="row"><div class="n"><b>${p}</b><span>Qoldi: ${left(p)}</span></div>
  <div class="st"><button onclick="add('${k}','${p}',-1)" aria-label="Kamaytirish">−</button><output>${(S.log[k]||{})[p]||0}</output><button onclick="add('${k}','${p}',1)" aria-label="Qo'shish">+</button></div></div>`).join('');
}
function setup(){
  const d=draft;
  const r=d.total!==undefined?`<div class="res">Jami qazo namozi<br><b>${(d.total*6).toLocaleString('uz')}</b><div class="hint">Har bir vaqt uchun ${d.total.toLocaleString('uz')} kun</div></div><button class="btn" onclick="confirmSetup()">Hisobni boshlash</button>`:'';
  return `<h1>Qazo hisobi</h1><p class="sub">Ma'lumotlarni kiriting, qazolar avtomatik hisoblanadi.</p>
  <div class="card"><label>Jins</label><div class="seg"><button class="${d.g==='m'?'on':''}" onclick="draft.g='m';draft.age=15;render()">Erkak</button><button class="${d.g==='f'?'on':''}" onclick="draft.g='f';draft.age=9;render()">Ayol</button></div>
  <label>Tug'ilgan sana</label><input type="date" id="birth" value="${d.birth||''}" max="${today}">
  <label>Balog'at yoshi</label><input type="number" id="age" min="7" max="20" value="${d.age}">
  <div class="hint">Odatda erkak uchun 15, ayol uchun 9 yosh olinadi. Kerak bo'lsa o'zgartiring.</div>
  <label>Namozni muntazam o'qiy boshlagan sana</label><input type="date" id="start" value="${d.start||''}" max="${today}">
  ${d.g==='f'?`<label>Oyiga hayz kunlari (qazo hisobidan chiqariladi)</label><input type="number" id="haid" min="0" max="15" value="${d.haid||0}"><div class="hint">Hayz kunlari namoz o'qilmaydi va qazo bo'lmaydi. Bilmasangiz 0 qoldiring.</div>`:''}
  <button class="btn g" onclick="doCalc()">Hisoblash</button>${r}</div>`;
}
function doCalc(){
  const g=draft.g,birth=document.getElementById('birth').value,start=document.getElementById('start').value;
  const age=+document.getElementById('age').value,haid=g==='f'?+document.getElementById('haid').value:0;
  if(!birth||!start){alert("Tug'ilgan sana va boshlagan sanani kiriting");return}
  if(new Date(start)<=new Date(birth)){alert("Boshlagan sana tug'ilgan sanadan keyin bo'lishi kerak");return}
  Object.assign(draft,{birth,start,age,haid,total:calc(g,birth,start,age,haid)});render();
}
function confirmSetup(){
  const t={};P.forEach(p=>t[p]=draft.total);
  S={g:draft.g,birth:draft.birth,start:draft.start,age:draft.age,haid:draft.haid,total:t,log:{}};
  save();tab='home';render();
}
function home(){
  const tot=P.reduce((a,p)=>a+S.total[p],0),dn=P.reduce((a,p)=>a+done(p),0),rem=tot-dn;
  const pct=tot?Math.round(dn/tot*100):100;
  return `<h1>Qazo hisobi</h1><p class="sub">${new Date().getFullYear()}-yil</p>
  <div class="cols"><div class="card hero a"><div class="l">Qolgan qazo namozlar</div><div class="big">${rem.toLocaleString('uz')}</div><div class="l">${dn.toLocaleString('uz')} ta o'qilgan · ${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="card b"><h2>Bugun, ${new Date().getDate()} ${MON[new Date().getMonth()]}</h2><p class="sub" style="margin:-6px 0 4px">${dayN(today)?`Bugun jami ${dayN(today)} ta o'qildi`:"Bugun hali o'qilmagan"}</p>${steppers(today)}</div>
  <div class="card c"><h2>Vaqtlar bo'yicha</h2>${P.map(p=>{const t=S.total[p],pc=t?Math.round(done(p)/t*100):100;return `<div class="row"><div class="n"><b>${p}</b><span>${left(p).toLocaleString('uz')} ta qoldi</span><div class="mini"><i style="width:${pc}%"></i></div></div><span>${pc}%</span></div>`}).join('')}</div></div>`;
}
function cal(){
  const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1),n=new Date(y,m+1,0).getDate();
  const off=(first.getDay()+6)%7;
  let mt=0,md=0;
  let cells='';for(let i=0;i<off;i++)cells+='<div class="d x"></div>';
  for(let d=1;d<=n;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d),c=dayN(k);mt+=c;if(c)md++;
    cells+=`<button class="d ${c>=6?'full':c?'has':''} ${k===today?'today':''} ${k===sel?'sel':''}" onclick="sel='${k}';render()">${d}<small>${c||''}</small></button>`;
  }
  const sd=new Date(sel+'T00:00');
  return `<h1>Kalendar</h1><p class="sub">Kunni bosing va o'qilgan namozlarni belgilang.</p>
  <div class="cols"><div class="stats a"><div><b>${mt}</b><span>${MON[m]}da o'qilgan</span></div><div><b>${md}</b><span>faol kun</span></div></div>
  <div class="card c"><div class="mh"><button onclick="cm=new Date(${y},${m-1},1);render()" aria-label="Oldingi oy">‹</button><h2 style="margin:0">${MON[m]} ${y}</h2><button onclick="cm=new Date(${y},${m+1},1);render()" aria-label="Keyingi oy">›</button></div>
  <div class="grid">${['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells}</div></div>
  <div class="card b"><h2>${sd.getDate()} ${MON[sd.getMonth()]} ${sd.getFullYear()} · ${dayN(sel)} ta</h2>${steppers(sel)}</div></div>`;
}
let ed=null;
function go(t){tab=t;if(t==='set')ed={g:S.g,birth:S.birth,age:S.age,start:S.start,haid:S.haid||0};render();scrollTo(0,0)}
function setG(g){if(ed.age==(ed.g==='m'?15:9))ed.age=g==='m'?15:9;ed.g=g;render()}
function saveEd(){
  if(!ed.birth||!ed.start){alert("Sanalarni kiriting");return}
  if(new Date(ed.start)<=new Date(ed.birth)){alert("Boshlagan sana tug'ilgan sanadan keyin bo'lishi kerak");return}
  const age=+ed.age,haid=ed.g==='f'?+ed.haid||0:0,t=calc(ed.g,ed.birth,ed.start,age,haid);
  Object.assign(S,{g:ed.g,birth:ed.birth,start:ed.start,age,haid});
  P.forEach(p=>S.total[p]=t);save();render();
  alert("Saqlandi. Har bir vaqt uchun jami qazo: "+t.toLocaleString('uz')+" ta. O'qilganlar saqlanib qoldi.");
}
function settings(){
  const e=ed;
  return `<h1>Sozlamalar</h1><p class="sub">Ma'lumotlar shu qurilma brauzerida saqlanadi.</p><div class="cols"><div class="a"><div class="card"><h2>Mening ma'lumotlarim</h2>
  <label>Jins</label><div class="seg"><button class="${e.g==='m'?'on':''}" onclick="setG('m')">Erkak</button><button class="${e.g==='f'?'on':''}" onclick="setG('f')">Ayol</button></div>
  <label>Tug'ilgan sana</label><input type="date" value="${e.birth}" max="${today}" onchange="ed.birth=this.value">
  <label>Balog'at yoshi</label><input type="number" min="7" max="20" value="${e.age}" onchange="ed.age=this.value">
  <label>Namozni muntazam o'qiy boshlagan sana</label><input type="date" value="${e.start}" max="${today}" onchange="ed.start=this.value">
  ${e.g==='f'?`<label>Oyiga hayz kunlari</label><input type="number" min="0" max="15" value="${e.haid}" onchange="ed.haid=this.value">`:''}
  <div class="hint">Saqlasangiz qazo soni qayta hisoblanadi. O'qilgan namozlaringiz o'chmaydi.</div>
  <button class="btn" onclick="saveEd()">Saqlash va qayta hisoblash</button></div></div><div class="b">
  <div class="card"><h2>Zaxira nusxa</h2><p class="hint" style="margin-top:0">Telefonni almashtirsangiz yoki brauzer tozalansa, nusxadan tiklaysiz.</p>
  <button class="btn g" onclick="exp()">Nusxani yuklab olish</button>
  <button class="btn g" onclick="document.getElementById('f').click()">Nusxadan tiklash</button><input type="file" id="f" accept=".json" hidden onchange="imp(this)"></div>
  <div class="card"><h2>Ko'rinish</h2><div class="seg"><button onclick="theme('light')">Och</button><button onclick="theme('dark')">Qorong'u</button></div></div>
  <div class="card"><h2>Qaytadan hisoblash</h2><p class="hint" style="margin-top:0">Barcha belgilangan namozlar o'chadi.</p><button class="btn r" onclick="if(confirm('Hamma ma\\'lumot o\\'chiriladi. Davom etasizmi?')){S=null;localStorage.removeItem(KEY);draft={g:'m',age:15};render()}">Hammasini o'chirish</button></div></div></div>`;
}
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('qazo_theme',t)}catch(e){}}
try{const t=localStorage.getItem('qazo_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='qazo-nusxa-'+today+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.total||!o.log)throw 0;S=o;save();render()}catch(e){alert("Fayl noto'g'ri")}};r.readAsText(f)}
function render(){
  const app=document.getElementById('app'),nav=document.getElementById('nav');
  if(!S){app.innerHTML=setup();nav.style.display='none';return}
  nav.style.display='flex';
  app.innerHTML=tab==='home'?home():tab==='cal'?cal():settings();
  nav.innerHTML=[['home','◉','Asosiy'],['cal','▦','Kalendar'],['set','⚙','Sozlamalar']].map(([t,i,l])=>`<button class="${tab===t?'on':''}" onclick="go('${t}')"><b>${i}</b>${l}</button>`).join('');
}
render();
</script>
</body>
</html>
